<div>
  <h1 class="mb-3">Coworking</h1>
  <p class="text-muted">Reserva mesa o consulta tarifas.</p>

  <div *ngIf="loading" class="d-flex justify-content-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="row g-3">
    <div *ngFor="let item of items" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100">
        <img *ngIf="item.image" [src]="item.image" class="card-img-top" alt="{{ item.name }}">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ item.name }}</h5>
          <p class="card-text text-muted mb-2">{{ item.description }}</p>
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <span class="fw-bold">{{ item.fee ? (item.fee + ' €') : '' }}</span>
            <a [routerLink]="['/coworking', item.id]" class="btn btn-sm btn-outline-primary">Detalles</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
