<div class="container">
  <h1 class="mb-4">Coworking</h1>

  <div *ngIf="loading" class="d-flex justify-content-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="row g-3">
    <div *ngFor="let r of rooms" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100" style="cursor:pointer;">
        <img *ngIf="r.image" [src]="r.image" class="card-img-top" [alt]="r.name">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ r.name }}</h5>
          <p class="card-text text-muted mb-2">{{ r.description }}</p>
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <span class="fw-bold">{{ r.capacity ? (r.capacity + ' pax') : '' }}</span>
            <a [routerLink]="['/coworking', r.id]" class="btn btn-sm btn-outline-primary">Ver</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
