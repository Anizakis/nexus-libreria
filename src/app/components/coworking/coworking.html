<div class="container mt-4">
  <h2>Coworking</h2>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="rooms.length > 0" class="row g-3">
    <div *ngFor="let room of rooms" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 cursor-pointer" (click)="goToDetail(room.id)" style="cursor: pointer;">
        <img *ngIf="room.image" [src]="room.image" class="card-img-top" [alt]="room.name" style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ room.name }}</h5>
          <p class="card-text text-muted">{{ room.description }}</p>
          <div class="mt-auto">
            <p class="mb-2"><strong>Capacidad:</strong> {{ room.capacity }} personas</p>
            <p *ngIf="room.precio" class="text-primary"><strong>{{ room.precio | number:'1.2-2' }} €</strong></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="rooms.length === 0 && !loading && !error" class="alert alert-info">
    No hay salas disponibles.
  </div>
</div>
