<a routerLink="/coworking" class="d-inline-block mb-3">&larr; Volver a coworking</a>

<div *ngIf="loading" class="d-flex justify-content-center py-4">
  <div class="spinner-border text-primary" role="status"></div>
</div>

<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<div *ngIf="item" class="row g-4">
  <div class="col-12 col-md-5">
    <img *ngIf="item.image" [src]="item.image" [alt]="item.name || item.title" class="img-fluid rounded">
  </div>

  <div class="col-12 col-md-7">
    <h2 class="h4 mb-2">{{ item.name || item.title }}</h2>
    <p class="text-muted mb-2">{{ item.description }}</p>

    <ul class="list-unstyled mb-3">
      <li *ngIf="item.capacity"><strong>Capacidad:</strong> {{ item.capacity }}</li>
      <li *ngIf="item.fee"><strong>Tarifa:</strong> {{ item.fee }} €</li>
      <li *ngIf="item.location"><strong>Ubicación:</strong> {{ item.location }}</li>
    </ul>

    <form [formGroup]="form" (ngSubmit)="placeBooking()" class="mt-3">
      <div class="mb-2">
        <label class="form-label">Fecha</label>
        <input type="date" formControlName="date" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Horas</label>
        <input type="number" formControlName="hours" class="form-control" min="1">
      </div>

      <div class="mb-3">
        <label class="form-label">Nota</label>
        <input formControlName="note" class="form-control" placeholder="Información adicional (opcional)">
      </div>

      <div class="d-flex align-items-center">
        <button class="btn btn-primary me-2" type="submit" [disabled]="booking">{{ booking ? 'Enviando...' : 'Solicitar reserva' }}</button>
      </div>

      <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
    </form>
  </div>
</div>
