<div class="app-container">
  <div class="container py-4">
  <div class="mb-3">
    <button class="btn btn-outline-secondary" (click)="back()">
      <i class="bi bi-arrow-left me-1"></i>
      Volver
    </button>
  </div>

  <div *ngIf="loading" class="d-flex justify-content-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="item && !loading" class="row g-4">
    <div class="col-md-5">
      <img *ngIf="item.image" [src]="item.image" class="img-fluid rounded" [alt]="item.name" style="width: 100%;">
    </div>

    <div class="col-md-7">
      <h2 class="mb-2">{{ item.name }}</h2>
      <p class="text-muted mb-3">{{ item.description }}</p>

      <ul class="list-unstyled mb-4">
        <li><strong>Capacidad:</strong> {{ item.capacity }} personas</li>
        <li *ngIf="item?.precio"><strong>Precio:</strong> {{ item?.precio | number:'1.2-2' }} €</li>
        <li *ngIf="item.planta"><strong>Planta:</strong> {{ item.planta }}</li>
      </ul>

      <!-- Formulario de reserva -->
      <form [formGroup]="form" (ngSubmit)="addToCart()" class="mt-4">
        <div class="mb-3">
          <label class="form-label">Fecha</label>
          <input formControlName="date" type="date" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Horas</label>
          <input formControlName="hours" type="number" class="form-control" min="1" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Notas (opcional)</label>
          <textarea formControlName="notes" class="form-control" rows="2" placeholder="Información adicional"></textarea>
        </div>

        <button class="btn btn-primary btn-lg" type="submit" [disabled]="booking">
          {{ booking ? 'Enviando...' : 'Añadir al carrito' }}
        </button>
      </form>

      <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
      <div *ngIf="addedMessage" class="alert alert-success mt-3">{{ addedMessage }}</div>
    </div>
  </div>

  <div *ngIf="!item && !loading && !error" class="alert alert-warning">
    Sala no encontrada.
  </div>
</div>
</div>
