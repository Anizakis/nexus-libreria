<div class="app-container">
  <h1 class="mb-3">Cafetería</h1>
  <p class="text-muted">Bebidas y snacks disponibles.</p>

  <div *ngIf="addedMessage" class="alert alert-success py-2 mb-3">{{ addedMessage }}</div>

  <div *ngIf="loading" class="d-flex justify-content-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="categories.length" class="mb-3">
    <small class="text-muted">Categorías:</small>
    <div class="mt-2">
      <button type="button" class="btn btn-sm me-1 category-badge"
              [class.active]="!selectedCategoryName"
              (click)="selectedCategoryName = null">Todos</button>

      <button *ngFor="let c of categories"
              type="button"
              class="btn btn-sm me-1 category-badge"
              [class.active]="selectedCategoryName === getCategoryLabel(c)"
              (click)="selectCategory(c)">
        {{ getCategoryLabel(c) }}
      </button>
    </div>
  </div>

  <div class="row g-3">
    <div *ngFor="let p of filteredProducts" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100" (click)="viewProductDetails(p.id)" style="cursor:pointer;">
        <img *ngIf="p.image" [src]="p.image" class="card-img-top" [alt]="p.name || p.title">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ p.name }}</h5>
          <p class="card-text text-muted mb-2">{{ p.description }}</p>
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <span class="fw-bold">{{ p.price ? (p.price + ' €') : '' }}</span>
            <!-- Botón Añadir: detiene propagación para evitar navegación -->
            <button type="button" class="btn btn-sm btn-primary" (click)="addToCart(p); $event.stopPropagation(); $event.preventDefault()">Añadir</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
