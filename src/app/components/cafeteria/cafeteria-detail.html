<div class="app-container">
  <div class="p-3">
    <button class="btn btn-outline-secondary" (click)="back()">
      <i class="bi bi-arrow-left me-1"></i>
      Volver
    </button>
  </div>

  <div *ngIf="loading" class="d-flex justify-content-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="addedMessage" class="alert alert-success py-2 mb-3">{{ addedMessage }}</div>

  <div *ngIf="product" class="row g-4">
    <div class="col-12 col-md-5">
      <img *ngIf="product?.image" [src]="product.image" [alt]="product?.name" class="img-fluid rounded">
      <div *ngIf="!product?.image" class="text-muted">Imagen no disponible</div>
    </div>
    <div class="col-12 col-md-7">
      <h2 class="h4">{{ product.name }}</h2>
      <p class="text-muted">{{ product.description }}</p>
      <p class="fw-bold">{{ product.price ? (product.price + ' €') : '' }}</p>

      <form [formGroup]="form" (ngSubmit)="placeOrder()" class="mt-3">
        <div class="mb-2">
          <label class="form-label">Cantidad</label>
          <input type="number" formControlName="quantity" class="form-control" min="1">
        </div>
        <div class="mb-3">
          <label class="form-label">Nota</label>
          <input formControlName="note" class="form-control" placeholder="Instrucciones (opcional)">
        </div>

        <div class="d-flex align-items-center">
          <button class="btn btn-primary me-2" type="button" (click)="addToCartFromDetail()">Añadir al carrito</button>
        </div>

        <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
      </form>
    </div>
  </div>
</div>
