<div class="landing-container">
  <!-- HERO SECTION MEJORADO -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">{{ tienda }}</h1>
      <p class="hero-subtitle">{{ descripcion }}</p>
      <p class="hero-description">
        Acceso completo a libros, cafetería y espacios de coworking. 
        Todo lo que necesitas para estudiar y trabajar en un solo lugar.
      </p>
    </div>

    <!-- Decoración visual -->
    <div class="hero-decoration">
      <div class="decoration-item deco-1">📚</div>
      <div class="decoration-item deco-2">☕</div>
      <div class="decoration-item deco-3">💼</div>
    </div>
  </section>

  <!-- SECCIONES (3 CARDS) -->
  <section class="features">
    <div class="container">
      <div class="row g-4">
        <div *ngFor="let section of sections" class="col-md-4">
          <div class="feature-card card h-100" [routerLink]="section.link" style="cursor: pointer;">
            <div class="card-body text-center">
              <div class="card-icon">{{ section.icon }}</div>
              <h5 class="card-title">{{ section.title }}</h5>
              <p class="card-text">{{ section.description }}</p>
            </div>
            <div class="card-footer bg-transparent border-0 text-center">
              <a [routerLink]="section.link" class="btn btn-sm btn-outline-primary">
                Explorar
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
